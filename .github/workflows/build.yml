name: Build

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure (host build)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        run: cmake --build build --target SysConTests -j

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Configure ControllerLib standalone
        run: cmake -S src/controllerlib -B build-controllerlib

      - name: Build ControllerLib standalone
        run: cmake --build build-controllerlib -j

  build:
    needs: test
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0   # full history + tags so the Makefile's `git describe` works

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install libnx
        run: make -C external/libnx install

      - name: Build and assemble release tree
        run: |
          make all
          cd out 
          zip -r ../sys-con.zip *

      

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          path: sys-con.zip
          if-no-files-found: error

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.release_token }}
          file: sys-con.zip
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
